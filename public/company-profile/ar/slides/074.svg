٠ م²، ويشمل مكتباً مميزاً بمساحة ٢٠٠</tspan><tspan x="1318" y="303.95">م² في كايرو فستيفال سيتي. ويهدف</tspan><tspan x="1318" y="325.93">التصميم إلى تحسين التواصل وإدارة</tspan><tspan x="1318" y="347.92">المشروعات.</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="376.32">شمل نطاق عمل بيكت التصميم المبدئي،</tspan><tspan x="1318" y="398.3">والرسومات التفصيلية، ومستندات الطرح،</tspan><tspan x="1318" y="420.29">والإشراف الميداني، وإدارة المشروع. وغطت</tspan><tspan x="1318" y="442.27">الخدمات التصميم المعماري، والهندسة</tspan><tspan x="1318" y="464.25">الإنشائية والمدنية، والهندسة الميكانيكية،</tspan><tspan x="1318" y="486.24">والهندسة الكهربائية.</tspan></text></g></svg>
