an></text><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="283.0">الشركة القابضة للقطن والغزل والنسيج</tspan></text><rect x="1348" y="245.0" width="280" height="47.0" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1619" y="309.0">تاريخ الإنجاز</tspan></text><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="330.0">٢٠٢٠</tspan></text><text direction="rtl" text-anchor="start" x="1479.0" font-family="'Noto Kufi Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1479.0" y="309.0">القيمة التقديرية</tspan></text><text direction="rtl" text-anchor="start" x="1479.0" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1479.0" y="330.0">٥٠٠ مليون جنيه</tspan><tspan x="1479.0" y="351.8">مصري</tspan></text><line x1="1488.0" y1="292.0" x2="1488.0" y2="360.798" stroke="#79b4cf" stroke-opacity="0.64" stroke-width="0.75" /><rect x="1348" y="292.0" width="280" height="68.8" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1619" y="377.8">التخصصات</tspan></text><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="398.8">تنسيق المواقع، التصميم المعماري، الهندسة</tspan><tspan x="1619" y="420.6">الإنشائية والمدنية، الهندسة الميكانيكية،</tspan><tspan x="1619" y="442.39">الهندسة الكهربائية</tspan></text><rect x="1348" y="360.798" width="280" height="90.6" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /></g><g data-role="text" data-step="2"><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="10" font-weight="610" fill="#b9e1ef"><tspan x="1318" y="214">نبذة عن المشروع</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="238.0">شمل المشروع إعداد التصميم التفصيلي</tspan><tspan x="1318" y="259.98">والتنسيق بين التخصصات والإشراف على إنشاء</tspan><tspan x="1318" y="281.97">ثلاث صالات صناعية جديدة لمحالج القطن.</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="310.37">شمل نطاق عمل بيكت التصميم المبدئي،</tspan><tspan x="1318" y="332.35">والرسومات التفصيلية، والإشراف الميداني،</tspan><tspan x="1318" y="354.34">وإدارة المشروع. وغطت الخدمات تنسيق</tspan><tspan x="1318" y="376.32">المواقع، والتصميم المعماري، والهندسة</tspan><tspan x="1318" y="398.3">الإنشائية والمدنية، والهندسة الميكانيكية،</tspan><tspan x="1318" y="420.29">والهندسة الكهربائية.</tspan></text></g></svg>
