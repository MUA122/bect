<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>محالج القطن الجديدة</title><desc>محالج القطن الجديدة
الموقع، الزقازيق وكفر الزيات وكفر الدوار، مصر
العميل، الشركة القابضة للقطن والغزل والنسيج
تاريخ الإنجاز، ٢٠٢٠
القيمة التقديرية، ٥٠٠ مليون جنيه مصري
التخصصات، تنسيق المواقع، التصميم المعماري، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
شمل المشروع إعداد التصميم التفصيلي والتنسيق بين التخصصات والإشراف على إنشاء ثلاث صالات صناعية جديدة لمحالج القطن.
شمل نطاق عمل بيكت التصميم المبدئي، والرسومات التفصيلية، والإشراف الميداني، وإدارة المشروع. وغطت الخدمات تنسيق المواقع، والتصميم المعماري، والهندسة الإنشائية والمدنية، والهندسة الميكانيكية، والهندسة الكهربائية.</desc><defs><clipPath id="ar-p55-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p55-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p55-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p55-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p55-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p55-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p55-clip_9"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M8064 0H8419V5953H8064Z" /></clipPath><mask id="ar-p55-mask_10"><g transform="matrix(.48414294,0,0,.48826973,814.6489,-8.56543)"><image id="ar-p55-image_11" width="1854" height="1254" href="/company-profile/media/362824d17dd3edc30e.jpg" data-screen-src="/company-profile/screen/362824d17dd3edc30e-1440.webp" /></g></mask><clipPath id="ar-p55-clip_13"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p55-clip_63"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p55-clip_64"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p55-clip_91"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H84