<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>الجامعات الأهلية المصرية</title><desc>الجامعات الأهلية المصرية
الموقع، عدة مدن مصرية
العميل، وزارة التعليم العالي
تاريخ الإنجاز، ٢٠٢٠
القيمة التقديرية، ٣٠ مليار جنيه مصري
التخصصات، التخطيط والتصميم العمراني، تنسيق المواقع
نبذة عن المشروع
اكتمل المشروع عام ٢٠٢٠ وشمل التصميم العمراني وتنسيق المواقع لجامعات أهلية في عدد من المدن المصرية. وأدخل التصميم نباتات محلية وساحات وبرجولات ومظلات ومناطق لتناول الطعام، لتحسين راحة الطلاب وتجربتهم اليومية. وقدمت بيكت خدمات التخطيط العمراني وتنسيق المواقع لصالح وزارة التعليم العالي.</desc><defs><clipPath id="ar-p36-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p36-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p36-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p36-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p36-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p36-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p36-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M8220 0H8419V5953H8220Z" /></clipPath><mask id="ar-p36-mask_9"><g transform="matrix(.48409046,0,0,.48812128,830.4539,-8.441467)"><image id="ar-p36-image_10" width="1821" height="1254" href="/company-profile/media/f8567c980fee69ac34.jpg" data-screen-src="/company-profile/screen/f8567c980fee69ac34-1440.webp" /></g></mask><clipPath id="ar-p36-clip_12"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p36-clip_61"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p36-clip_62"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p36-clip_88"><path transform="matrix(1