<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>مدرسة آي سيتي الدولية</title><desc>مدرسة آي سيتي الدولية
الموقع، مدينة ٦ أكتوبر، مصر
العميل، مجموعة مصر للتعليم (ELG)
تاريخ الإنجاز، ٢٠٢١
القيمة التقديرية، ٢٨٠ مليون جنيه مصري
التخصصات، تنسيق المواقع، التصميم الداخلي، التصميم المعماري، الهندسة الإنشائية والمدنية، التصميم البيئي، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
اكتملت المدرسة الخاصة عام ٢٠٢١ على مساحة ١٠ أفدنة في مدينة ٦ أكتوبر لصالح مجموعة مصر للتعليم. وقدمت بيكت خدمات العمارة وتنسيق المواقع والتصميم الداخلي والدراسات البيئية والهندسة الإنشائية والأنظمة الكهروميكانيكية والصحية (MEP)، إلى جانب إدارة المشروع والإشراف الميداني، لتهيئة بيئة تعليمية عالية الجودة للطلاب.</desc><defs><clipPath id="ar-p46-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p46-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p46-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p46-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p46-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p46-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p46-clip_37"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p46-clip_38"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p46-clip_53"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p46-clip_54"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p46-clip_63"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p46-clip_65"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" 