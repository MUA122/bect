i Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1619" y="377.8">التخصصات</tspan></text><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="398.8">تنسيق المواقع، التصميم الداخلي، التصميم</tspan><tspan x="1619" y="420.6">المعماري، الهندسة الإنشائية والمدنية،</tspan><tspan x="1619" y="442.39">التصميم البيئي، الهندسة الميكانيكية،</tspan><tspan x="1619" y="464.19">الهندسة الكهربائية</tspan></text><rect x="1348" y="360.798" width="280" height="112.39" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /></g><g data-role="text" data-step="2"><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="10" font-weight="610" fill="#b9e1ef"><tspan x="1318" y="214">نبذة عن المشروع</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="238.0">اكتملت المدرسة الخاصة عام ٢٠٢١ على</tspan><tspan x="1318" y="259.98">مساحة ١٠ أفدنة في مدينة ٦ أكتوبر لصالح</tspan><tspan x="1318" y="281.97">مجموعة مصر للتعليم. وقدمت بيكت خدمات</tspan><tspan x="1318" y="303.95">العمارة وتنسيق المواقع والتصميم الداخلي</tspan><tspan x="1318" y="325.93">والدراسات البيئية والهندسة الإنشائية</tspan><tspan x="1318" y="347.92">والأنظمة الكهروميكانيكية والصحية (⁦MEP⁩)،</tspan><tspan x="1318" y="369.9">إلى جانب إدارة المشروع والإشراف الميداني،</tspan><tspan x="1318" y="391.88">لتهيئة بيئة تعليمية عالية الجودة للطلاب.</tspan></text></g></svg>
