<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>منتجع سول الفاخر</title><desc>منتجع سول الفاخر
الموقع، الساحل الشمالي، مصر
العميل، البنك التجاري الدولي (CIB)
حالة المشروع، قيد التنفيذ
القيمة التقديرية، ١٫٦ مليار جنيه مصري
التخصصات، التخطيط والتصميم العمراني، تنسيق المواقع، التصميم المعماري، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
يضم المنتجع على الساحل الشمالي ١٤١ فيلا و١٧٢ مبنى صُممت وفق معايير رفيعة. وتشمل خدمات بيكت لصالح إيجل هيلز العقارية والبنك التجاري الدولي مراجعة الرسومات، ومتابعة تقدم الأعمال والبرنامج الزمني والتدفقات النقدية، والتحقق من الالتزام بمتطلبات الجودة والصحة والسلامة والبيئة (HSE).
شمل نطاق عمل بيكت مستندات الطرح، والإشراف الميداني، وإدارة المشروع.</desc><defs><clipPath id="ar-p22-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p22-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p22-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p22-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p22-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p22-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p22-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p22-clip_45"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p22-clip_46"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p22-clip_67"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p22-clip_68"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p22-clip_78"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p22-clip_80"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z" /></clipPath><clipPath id="ar-p22-clip_82"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H