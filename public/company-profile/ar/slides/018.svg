<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>شاطئ نصف القمر</title><desc>شاطئ نصف القمر
الموقع، الدمام، السعودية
العميل، أمانة المنطقة الشرقية، السعودية
تاريخ الإنجاز، ٢٠١٣
القيمة التقديرية، ١٤ مليار ريال سعودي
التخصصات، التخطيط والتصميم العمراني، تنسيق المواقع، التصميم المعماري
نبذة عن المشروع
كلّفت أمانة المنطقة الشرقية بيكت بمشروع تطوير الخليج في الدمام على مساحة ٦٠٬٠٠٠ فدان. اكتمل المشروع عام ٢٠١٣ بقيمة إنشائية قُدّرت بنحو ١٤ مليار ريال سعودي. يجمع التصميم بين اليابسة والمياه في هوية مكانية مميزة، ويصل بين عناصر الطبيعة والعمران ليتيح للزوار الاستمتاع بالخليج والتفاعل مع محيطه.</desc><defs><clipPath id="ar-p18-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p18-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p18-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p18-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p18-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p18-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p18-clip_7"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M8121 0V5953H8419V0Z" /></clipPath><clipPath id="ar-p18-clip_9"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p18-clip_45"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p18-clip_46"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p18-clip_67"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p18-clip_68"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p18-clip_78"><path transfor