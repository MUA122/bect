<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>شبكات الصرف الصحي بالصوالح وفاقوس</title><desc>شبكات الصرف الصحي بالصوالح وفاقوس
الموقع، محافظة الشرقية، مصر
العميل، شركة مياه الشرب والصرف الصحي بالشرقية
حالة المشروع، قيد التنفيذ
القيمة التقديرية، ٢٨٠ مليون جنيه مصري
التخصصات، التصميم المعماري، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
يشمل المشروع تطوير وتأهيل شبكات الصرف الصحي في تجمع فاقوس والصوالح، بما فيه الحجاجية والسوادة والروضة. وتقدم بيكت خدمات العمارة والهندسة الإنشائية والمدنية والأنظمة الكهروميكانيكية والصحية (MEP) وإدارة المشروع والإشراف الميداني لصالح شركة مياه الشرب والصرف الصحي بالشرقية.</desc><defs><clipPath id="ar-p92-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p92-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p92-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p92-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p92-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p92-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p92-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p92-clip_45"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p92-clip_46"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p92-clip_67"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p92-clip_68"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p92-clip_78"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p92-clip_80"><path transform=