<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>مستشفى الليث</title><desc>مستشفى الليث
الموقع، القاهرة، مصر
العميل، وزارة الصحة السعودية
تاريخ الإنجاز، ٢٠١١
القيمة التقديرية، ٤٠ مليون جنيه مصري
التخصصات، التخطيط والتصميم العمراني، تنسيق المواقع، التصميم المعماري، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
اكتمل مشروع المستشفى في الليث عام ٢٠١١ لصالح وزارة الصحة السعودية، بقيمة إنشائية بلغت ٤٠ مليون جنيه مصري. وقدمت بيكت خدمات العمارة والهندسة الإنشائية والمدنية والأنظمة الكهروميكانيكية والصحية (MEP) والدعم الفني وإدارة المشروع للمنشأة الصحية.
شمل نطاق عمل بيكت التصميم المبدئي، والرسومات التفصيلية، ومستندات الطرح، والإشراف الميداني، وإدارة المشروع.</desc><defs><clipPath id="ar-p78-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p78-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p78-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p78-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p78-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p78-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p78-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M-20.0938-20.1367H16883.006V5972.9235H-20.0938Z" /></clipPath><clipPath id="ar-p78-clip_9"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M8437.38 5972.91 16883 5972.93V-20.1367L8124.2-20.1445Z" /></clipPath><clipPath id="ar-p78-clip_10"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8419V5953H0Z" /></clipPath><clipPath id="ar-p78-clip_12"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p78-clip_52"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p78-clip_53"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p78-clip_77"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p78-clip_78"><path tra