<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>تكييف مبنى الجراحة بجامعة طنطا</title><desc>تكييف مبنى الجراحة بجامعة طنطا
الموقع، طنطا، مصر
العميل، البنك التجاري الدولي (CIB)
حالة المشروع، قيد التنفيذ
القيمة التقديرية، نحو ٧٥ مليون جنيه مصري
التخصصات، التخطيط والتصميم العمراني، تنسيق المواقع، التصميم المعماري، الهندسة الكهربائية، الهندسة الميكانيكية، الهندسة الإنشائية والمدنية
نبذة عن المشروع
شمل المشروع أعمال تكييف الهواء (AC) بمبنى الجراحة في جامعة طنطا.
شمل نطاق عمل بيكت التصميم المبدئي، والرسومات التفصيلية، ومستندات الطرح، والإشراف الميداني، وإدارة المشروع. وغطت الخدمات التخطيط والتصميم العمراني، وتنسيق المواقع، والتصميم المعماري، والهندسة الكهربائية، والهندسة الميكانيكية، والهندسة الإنشائية والمدنية.</desc><defs><clipPath id="ar-p83-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p83-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p83-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p83-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p83-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p83-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p83-clip_37"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p83-clip_38"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p83-clip_54"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p83-clip_55"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p83-clip_62"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p83-clip_64"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z" /></clipPath><clipPath id="ar-p83-clip_66"><path transform="matrix(.1016