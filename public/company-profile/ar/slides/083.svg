pan><tspan x="1318" y="259.98">بمبنى الجراحة في جامعة طنطا.</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="288.39">شمل نطاق عمل بيكت التصميم المبدئي،</tspan><tspan x="1318" y="310.37">والرسومات التفصيلية، ومستندات الطرح،</tspan><tspan x="1318" y="332.35">والإشراف الميداني، وإدارة المشروع. وغطت</tspan><tspan x="1318" y="354.34">الخدمات التخطيط والتصميم العمراني، وتنسيق</tspan><tspan x="1318" y="376.32">المواقع، والتصميم المعماري، والهندسة</tspan><tspan x="1318" y="398.3">الكهربائية، والهندسة الميكانيكية، والهندسة</tspan><tspan x="1318" y="420.29">الإنشائية والمدنية.</tspan></text></g></svg>
