<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>مشروعات الخط الأول لمترو القاهرة الكبرى</title><desc>مشروعات الخط الأول لمترو القاهرة الكبرى
الموقع، القاهرة، مصر
العميل، الهيئة القومية للأنفاق (NAT)
تاريخ الإنجاز، ٢٠٢١
القيمة التقديرية، ٨٠ مليون يورو
التخصصات، التخطيط والتصميم العمراني، التصميم المعماري، الهندسة الكهربائية، الهندسة الإنشائية والمدنية
نبذة عن المشروع
الإشراف على ورشة مترو كوتسيكا. تولت بيكت الإشراف على الورشة لصالح الهيئة القومية للأنفاق، بقيمة إنشائية تقديرية بلغت ٨٠ مليون يورو. وشملت الخدمات العمارة والأعمال الإنشائية والمدنية والكهروميكانيكية والصحية (MEP) وإدارة المشروع والإشراف الميداني الكامل.
تصنيع ٢٠ قطاراً ووضعها في الخدمة. اكتمل المشروع عام ٢٠٢١ لصالح الهيئة، وبلغت قيمته ١٢٠ مليون يورو، وشمل تصنيع ٢٠ قطار مترو وإجراء اختبارات التشغيل ووضعها في الخدمة.</desc><defs><clipPath id="ar-p109-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p109-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p109-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p109-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p109-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p109-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p109-clip_39"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p109-clip_40"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p109-clip_58"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p109-clip_59"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p109-clip_68"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p109-clip_70"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z" /></clipPath><clipPath id="ar-p109-clip_72"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z" /></clipPat