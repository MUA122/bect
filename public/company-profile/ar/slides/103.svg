<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>محطات التحويل في العراق (IDP)</title><desc>محطات التحويل في العراق (IDP)
الموقع، العراق
العميل، جنرال إلكتريك (GE) ووزارة الكهرباء العراقية
تاريخ الإنجاز، ٢٠٢٢
القيمة التقديرية، ١٧ مليون دولار أمريكي لكل محطة
التخصصات، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
شمل المشروع المنجز التصميم المدني التفصيلي لأربع محطات تحويل كهربائية ضمن برنامج IDP، لصالح جنرال إلكتريك ووزارة الكهرباء العراقية. وقُدّرت القيمة الإنشائية لكل محطة بـ١٧ مليون دولار أمريكي. وشملت الخدمات العمارة والهندسة الإنشائية والمدنية والأنظمة الكهروميكانيكية والصحية (MEP) والدعم الفني.
شمل نطاق عمل بيكت الرسومات التفصيلية، ومستندات الطرح، والإشراف الميداني.</desc><defs><clipPath id="ar-p103-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p103-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p103-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p103-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p103-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p103-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p103-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p103-clip_48"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p103-clip_49"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p103-clip_71"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p103-clip_72"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p103-clip_82"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p103-clip_84"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z" /></clipPath><clipPath id="ar-p103-clip_86"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655