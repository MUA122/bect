<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>مجمع مارينا بورسعيد</title><desc>مجمع مارينا بورسعيد
الموقع، بورسعيد، مصر
العميل، محافظة بورسعيد
تاريخ الإنجاز، ٢٠١٥
القيمة التقديرية، ٢ مليار جنيه مصري
التخصصات، التخطيط والتصميم العمراني، تنسيق المواقع، التصميم المعماري
نبذة عن المشروع
يشمل المشروع تطوير مرسى لليخوت ومجمع سياحي على مساحة ٣٥٠ أكراً في بورسعيد. وتضمن نطاق العمل إعداد المخطط العام والتصميم المعماري وإدارة المشروع، إلى جانب الإشراف على التنفيذ والمعاينات الميدانية، للتحقق من مطابقة المنشآت والمرافق السياحية، بما فيها البنية التحتية للمرسى، للمواصفات.</desc><defs><clipPath id="ar-p30-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p30-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p30-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p30-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p30-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p30-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p30-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M7520 0V5953H8419V0Z" /></clipPath><clipPath id="ar-p30-clip_10"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p30-clip_48"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p30-clip_49"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p30-clip_71"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p30-clip_72"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p30-clip_83"><path transform="matrix