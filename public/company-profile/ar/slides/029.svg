ext direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="398.8">التخطيط والتصميم العمراني</tspan></text><rect x="1348" y="360.798" width="280" height="47.0" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /></g><g data-role="text" data-step="2"><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="10" font-weight="610" fill="#b9e1ef"><tspan x="1318" y="214">نبذة عن المشروع</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="238.0">يتضمن المشروع تصميم مشروعات التنمية</tspan><tspan x="1318" y="259.98">المحلية ضمن برنامج التنمية الاقتصادية المحلية</tspan><tspan x="1318" y="281.97">(⁦LED⁩) والإشراف على تنفيذها في أربع</tspan><tspan x="1318" y="303.95">محافظات هي الفيوم وبني سويف والأقصر</tspan><tspan x="1318" y="325.93">وأسوان. ويساند الوزارة في إرساء إدارة محلية</tspan><tspan x="1318" y="347.92">حديثة ولامركزية على المستويين المركزي</tspan><tspan x="1318" y="369.9">والمحلي، ترتكز على الحوكمة الرشيدة. ويعزز</tspan><tspan x="1318" y="391.88">التنمية المحلية المتكاملة برفع جودة الخدمات</tspan><tspan x="1318" y="413.86">العامة وتنمية الاقتصاد والمجتمع المحليين.</tspan></text></g></svg>
