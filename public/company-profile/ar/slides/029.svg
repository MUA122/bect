<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>مشروعات التنمية الاقتصادية المحلية</title><desc>مشروعات التنمية الاقتصادية المحلية
الموقع، محافظات الفيوم وبني سويف والأقصر وأسوان، مصر
العميل، وزارة التنمية المحلية
حالة المشروع، قيد التنفيذ
القيمة التقديرية، ٢٦٫٥ مليار جنيه مصري
التخصصات، التخطيط والتصميم العمراني
نبذة عن المشروع
يتضمن المشروع تصميم مشروعات التنمية المحلية ضمن برنامج التنمية الاقتصادية المحلية (LED) والإشراف على تنفيذها في أربع محافظات هي الفيوم وبني سويف والأقصر وأسوان. ويساند الوزارة في إرساء إدارة محلية حديثة ولامركزية على المستويين المركزي والمحلي، ترتكز على الحوكمة الرشيدة. ويعزز التنمية المحلية المتكاملة برفع جودة الخدمات العامة وتنمية الاقتصاد والمجتمع المحليين.</desc><defs><clipPath id="ar-p29-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p29-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p29-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p29-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p29-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p29-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p29-clip_13"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p29-clip_63"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p29-clip_64"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p29-clip_91"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p29-clip_92"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p29-clip_109"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418