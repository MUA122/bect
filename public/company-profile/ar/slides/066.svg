توم للنقل</tspan></text><rect x="1348" y="245.0" width="280" height="47.0" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1619" y="309.0">تاريخ الإنجاز</tspan></text><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="330.0">٢٠١٩</tspan></text><text direction="rtl" text-anchor="start" x="1479.0" font-family="'Noto Kufi Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1479.0" y="309.0">القيمة التقديرية</tspan></text><text direction="rtl" text-anchor="start" x="1479.0" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1479.0" y="330.0">٣٠ مليون جنيه مصري</tspan></text><line x1="1488.0" y1="292.0" x2="1488.0" y2="339.0" stroke="#79b4cf" stroke-opacity="0.64" stroke-width="0.75" /><rect x="1348" y="292.0" width="280" height="47.0" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="9.1" font-weight="580" fill="#b9e1ef"><tspan x="1619" y="356.0">التخصصات</tspan></text><text direction="rtl" text-anchor="start" x="1619" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.6" font-weight="470" fill="#ffffff"><tspan x="1619" y="377.0">التصميم المعماري، الهندسة الإنشائية</tspan><tspan x="1619" y="398.8">والمدنية، الهندسة الميكانيكية، الهندسة</tspan><tspan x="1619" y="420.6">الكهربائية</tspan></text><rect x="1348" y="339.0" width="280" height="90.6" fill="none" stroke="#79b4cf" stroke-width="0.65" stroke-opacity="0.71" /></g><g data-role="text" data-step="2"><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="10" font-weight="610" fill="#b9e1ef"><tspan x="1318" y="214">نبذة عن المشروع</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="238.0">تولت بيكت التصميم الكامل والإشراف على</tspan><tspan x="1318" y="259.98">تنفيذ طابقين، تبلغ مساحة الأول ١٬٦٨٠ م²</tspan><tspan x="1318" y="281.97">والثاني ١٬٥٠٠ م².</tspan></text><text direction="rtl" text-anchor="start" x="1318" font-family="'Noto Kufi Arabic',sans-serif" font-size="12.35" font-weight="450" fill="#ffffff"><tspan x="1318" y="310.37">شمل نطاق عمل بيكت التصميم المبدئي،</tspan><tspan x="1318" y="332.35">والرسومات التفصيلية، ومستندات الطرح،</tspan><tspan x="1318" y="354.34">والإشراف الميداني، وإدارة المشروع. وغطت</tspan><tspan x="1318" y="376.32">الخدمات التصميم المعماري، والهندسة</tspan><tspan x="1318" y="398.3">الإنشائية والمدنية، والهندسة الميكانيكية،</tspan><tspan x="1318" y="420.29">والهندسة الكهربائية.</tspan></text></g></svg>
