<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>مقر ألستوم</title><desc>مقر ألستوم
الموقع، القاهرة، مصر
العميل، ألستوم للنقل
تاريخ الإنجاز، ٢٠١٩
القيمة التقديرية، ٣٠ مليون جنيه مصري
التخصصات، التصميم المعماري، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
تولت بيكت التصميم الكامل والإشراف على تنفيذ طابقين، تبلغ مساحة الأول ١٬٦٨٠ م² والثاني ١٬٥٠٠ م².
شمل نطاق عمل بيكت التصميم المبدئي، والرسومات التفصيلية، ومستندات الطرح، والإشراف الميداني، وإدارة المشروع. وغطت الخدمات التصميم المعماري، والهندسة الإنشائية والمدنية، والهندسة الميكانيكية، والهندسة الكهربائية.</desc><defs><clipPath id="ar-p66-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p66-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p66-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p66-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p66-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p66-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p66-clip_9"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M8198 0H8419V5953H8198Z" /></clipPath><mask id="ar-p66-mask_10"><g transform="matrix(.48417933,0,0,.48829649,828.26266,-8.579712)"><image id="ar-p66-image_11" width="1826" height="1254" href="/company-profile/media/1a042f7673e10b56c2.jpg" data-screen-src="/company-profile/screen/1a042f7673e10b56c2-1440.webp" /></g></mask><clipPath id="ar-p66-clip_13"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p66-clip_60"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p66-clip_61"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p66-clip_87"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H