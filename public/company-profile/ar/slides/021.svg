<svg xmlns="http://www.w3.org/2000/svg" lang="ar" direction="rtl" width="1683.78" height="595.28" viewBox="0 0 1683.78 595.28" font-family="'Noto Kufi Arabic',sans-serif"><title>الإنارة والكهرباء والطاقة المتجددة بالمدينة المنورة</title><desc>الإنارة والكهرباء والطاقة المتجددة بالمدينة المنورة
الموقع، المدينة المنورة، السعودية
العميل، أمانة منطقة المدينة المنورة
حالة المشروع، قيد التنفيذ
القيمة التقديرية، ٣٧٥ مليون ريال سعودي
التخصصات، الهندسة الإنشائية والمدنية، الهندسة الميكانيكية، الهندسة الكهربائية
نبذة عن المشروع
يشمل المشروع الجاري لصالح أمانة المنطقة تأهيل أنظمة إنارة الطرق والأحياء وتشغيلها في المدينة المنورة، بقيمة إنشائية تقديرية تبلغ ٣٧٥ مليون ريال سعودي. وتتضمن الخدمات الإشراف والاعتمادات ومراجعة التصاميم وإعداد تقارير تقدم الأعمال طوال مدة التنفيذ.
شمل نطاق عمل بيكت التصميم المبدئي، والرسومات التفصيلية، ومستندات الطرح، والإشراف الميداني، وإدارة المشروع.</desc><defs><clipPath id="ar-p21-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z" /></clipPath><clipPath id="ar-p21-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p21-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z" /></clipPath><clipPath id="ar-p21-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p21-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z" /></clipPath><clipPath id="ar-p21-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p21-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M8232 0V5953H8419V0Z" /></clipPath><clipPath id="ar-p21-clip_10"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z" /></clipPath><clipPath id="ar-p21-clip_50"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z" /></clipPath><clipPath id="ar-p21-clip_51"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p21-clip_74"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z" /></clipPath><clipPath id="ar-p21-clip_75"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z" /></clipPath><clipPath id="ar-p21-clip_86"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z" /></clipPath><clipPath id="ar-p21-clip_88"><path transform="matrix(.10164022,0,0,-.101709,