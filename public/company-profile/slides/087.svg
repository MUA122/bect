Project Overview
This ongoing irrigation project
in Al-Ahsa includes a central
control station, a 10,000 m3 tank,
variable-frequency pumps and a 58
km network serving 194 beneficiaries
across 80 hectares. BECT reviews
designs, tenders, schedules, cash flow
and materials, monitors construction
and quantities, and supports overall
project delivery.</desc><defs><clipPath id="p87-clip_1"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M5 5H835.4085V590.28H5Z"/></clipPath><clipPath id="p87-clip_2"><path transform="matrix(1.01202,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z"/></clipPath><clipPath id="p87-clip_3"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H836.7668V595.28H0Z"/></clipPath><clipPath id="p87-clip_4"><path transform="matrix(1.0164021,0,0,-1.01709,-5.06012,600.3655)" d="M0 0H1683.78V595.28H0Z"/></clipPath><clipPath id="p87-clip_5"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 0H8418.87V5952.79H0Z"/></clipPath><clipPath id="p87-clip_6"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z"/></clipPath><clipPath id="p87-clip_8"><path transform="matrix(.10164022,0,0,-.101709,-5.06012,600.3655)" d="M0 5953H8419V0H0Z"/></clipPath><clipPath id="p87-clip_45"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M848.37289 5H1678.78V590.28H848.37289Z"/></clipPath><clipPath id="p87-clip_46"><path transform="matrix(1.01202,0,0,-1.01709,-15.1803,600.3655)" d="M0 0H1683.78V595.28H0Z"/></clipPath><clipPath id="p87-clip_67"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M847.0187 0H1683.78V595.28H847.0187Z"/></clipPath><clipPath id="p87-clip_68"><path transform="matrix(1.0164021,0,0,-1.01709,-22.56426,600.3655)" d="M0 0H1683.78V595.28H0Z"/></clipPath><clipPath id="p87-clip_78"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418.87 0H16837.74V5952.79H8418.87Z"/></clipPath><clipPath id="p87-clip_80"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z"/></clipPath><clipPath id="p87-clip_82"><path transform="matrix(.10164022,0,0,-.101709,-22.56426,600.3655)" d="M8418 0V5953H16838V0Z"/></clipPath><clipPath id="p87-clip_84"><path transform="matrix(.10164022,0,0,-.101709,-22.56426